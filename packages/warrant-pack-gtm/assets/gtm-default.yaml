version: "0.1.0"
defaults:
  path: deny
stakes:
  - id: draft-for-review
    match:
      actionKind: draft_email
    path: auto
  - id: reply-existing-thread
    match:
      actionKind: send_email
      audience: known
    path: auto
  - id: cold-email-hiring-manager
    match:
      actionKind: send_email
      audience: cold
    path: human
protectedAudiences:
  - "*@*.gov"
  - "press@*"
caps:
  perPrincipalDaily:
    send_email: 10
