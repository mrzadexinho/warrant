name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: warrant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
        env:
          WARRANT_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/warrant_test
      - name: offline demo
        run: |
          pnpm demo
          test -s packages/warrant-eve-outbound-demo/out/proof.md
      - name: verify the production certificate
        run: |
          pnpm --filter @idriszade/warrant-verify build
          cd packages/warrant-eve-outbound-demo/ceremony
          node ../../warrant-verify/dist/cli.js ledger.json \
            --verify-dsse certificate.dsse.json \
            --key "$(cat public-key.txt)"
      - name: README examples name real exports
        run: node scripts/check-readme-examples.mjs

  # A stranger's machine is not ubuntu + Node 20. This matrix proves the two claims that
  # must hold everywhere: the repo builds from a cold clone, and the production certificate
  # verifies byte-identically. DB-gated tests skip here by design; the full suite runs above.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
        exclude:
          - os: ubuntu-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: offline demo
        shell: bash
        run: |
          pnpm demo
          test -s packages/warrant-eve-outbound-demo/out/proof.md
      - name: verify the production certificate
        shell: bash
        run: |
          pnpm --filter @idriszade/warrant-verify build
          cd packages/warrant-eve-outbound-demo/ceremony
          node ../../warrant-verify/dist/cli.js ledger.json \
            --verify-dsse certificate.dsse.json \
            --key "$(cat public-key.txt)"
